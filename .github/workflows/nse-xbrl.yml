
name: NSE XBRL Disclosure Downloader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-disclosures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download NSE XBRL disclosures
        run: python nse_xbrl_fetch.py --manifest nse_xbrl_manifest.csv --output downloaded_disclosures
