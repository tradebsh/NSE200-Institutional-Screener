
name: NSE XBRL Disclosure Downloader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-disclosures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Extract official NSE filing links
        run: python extract_nse_links.py

      - name: Match Nifty 200 filings
        run: python match_nifty200_filings.py

      - name: Upload matched Nifty 200 filings
        uses: actions/upload-artifact@v4
        with:
          name: nifty200-matched-filings
          path: nifty200_matched_filings.csv
          if-no-files-found: error

      - name: Upload discovered filing links
        uses: actions/upload-artifact@v4
        with:
          name: nse-discovered-filings
          path: nse_discovered_filings.csv
          if-no-files-found: error

      - name: Download NSE XBRL disclosures
        run: python parse_xbrl.py
        
      - name: Upload ownership CSV
        uses: actions/upload-artifact@v4
        with:
          name: verified-shareholding-history
          path: data/shareholding_history.csv
