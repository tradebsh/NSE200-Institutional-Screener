
name: NSE XBRL Disclosure Downloader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-disclosures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test NSE XML downloader
        continue-on-error: true
        run: python nse_xbrl_fetch.py

      - name: Download NSE XBRL disclosures
        run: python parse_xbrl.py
        
      - name: Upload ownership CSV
        uses: actions/upload-artifact@v4
        with:
          name: verified-shareholding-history
          path: data/shareholding_history.csv
